<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Imagen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #e8d7ff,
                #d3b7f5,
                #f3eaff
            );

            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 95%;
            height: 95vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        img {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(90, 50, 130, 0.25);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <img
            src="{{ url_for('static', filename='Carta.png') }}"
            alt="Imagen privada"
        >

    </div>

</body>
</html>
