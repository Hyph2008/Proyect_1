<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eadcff,
                #d8c2ff,
                #f1e7ff
            );
        }

        .card {
            width: 400px;
            padding: 40px;

            background: #ffffff;
            border-radius: 25px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(100, 70, 150, 0.20);
        }

        h1 {
            margin-bottom: 10px;
            color: #7046a8;
        }

        p {
            color: #8b6aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;

            margin-bottom: 8px;

            color: #7046a8;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 2px solid #ddc9f7;
            border-radius: 12px;

            outline: none;

            font-size: 16px;
        }

        input:focus {
            border-color: #a875d1;
        }

        button {
            width: 100%;
            margin-top: 20px;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #b58add;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #9f70c9;
        }

        .mensaje {
            margin-top: 20px;
            color: #8b5bad;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Bienvenido ✨</h1>

        <p>Introduce tu nombre completo para continuar.</p>

        <form method="POST">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Nombre Completo"
                required
            >

            <button type="submit">
                Verificar acceso
            </button>

        </form>

        {% if mensaje %}
            <div class="mensaje">
                {{ mensaje }}
            </div>
        {% endif %}

    </div>

</body>
</html>
